name: Deploy CrystalTalk website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "share-hq-v3/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build social share image
        run: |
          cat share-hq-v3/part*.txt | tr -d '\n\r' | base64 --decode > /tmp/crystaltalk-share-source.jpg
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/crystaltalk-share-source.jpg').convert('RGB')
          im = im.resize((1200, 630), Image.Resampling.LANCZOS)
          im.save('dist/crystaltalk-share-v4.jpg', 'JPEG', quality=92, optimize=True, progressive=False, subsampling=0)
          print(im.size)
          PY
          file dist/crystaltalk-share-v4.jpg
          test -s dist/crystaltalk-share-v4.jpg
      - name: Upload CrystalTalk site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
