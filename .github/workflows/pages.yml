name: Deploy CrystalTalk website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "share-hq-v3/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build social share image
        run: cat share-hq-v3/part*.txt | tr -d '\n\r' | base64 --decode > dist/crystaltalk-share-v3.jpg
      - name: Upload CrystalTalk site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
